title: Obsession Residue
pov: Hugo
logline: Hugo brings a set of hypercore units home; their quiet resonance turns his focus into relentless obsession that fuels rapid learning but isolates him, until disconnection leaves him relieved and bereft.
setting:
  time: modern near-future
  place: Hugo's apartment; campus periphery
devices:
  - disembodied hypercore units (PHCUs) acting as passive cognitive amplifiers
  - background hum/dreamspace influence
characters:
  hugo:
    role: protagonist
    traits: gifted, obsessive under PHCU influence, neglectful of social ties
  victoria:
    role: lover/trigger; intermittent presence
    traits: reckless, magnetic, pragmatic about using Hugo
themes:
  - obsession vs. agency
  - accelerated learning at the cost of connection
  - relief and emptiness after artificial drive is removed
structure:
  - inciting: Hugo takes units home and starts an affair with Victoria
  - escalation: obsessive learning sprints (French, physics) replace school/friends
  - crisis: eviction exposes forgotten units
  - resolution: unplugging brings breath-like relief and sense of abandonment
tone: intimate, slightly claustrophobic, analytical with sensory edges
ending: quiet realization that the ferocious determination was never his alone
